name: Dependencies

on:
  pull_request:
  push:
    branches:
      - main
  # New RustSec entries appear without any change to the code.
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cargo-deny:
    name: Known vulnerabilities, licenses and sources
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master on 2026-11-15
        with:
          toolchain: stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deny@0.22.0
          checksum: true

      # Configuration in deny.toml. The bans check is not run.
      - name: Check dependencies
        shell: bash
        run: cargo deny --locked check advisories licenses sources
