name: CI

on:
  pull_request:
    types:
      - opened
      - ready_for_review
      - reopened
      - synchronize

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUSTFLAGS: "-D warnings"

jobs:
  formatting:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rustfmt

      - name: Check formatting
        shell: bash
        run: cargo +nightly fmt --all --check

  check-msrv:
    name: Check compilation on MSRV toolchain
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install mold linker
        uses: rui314/setup-mold@v1
        if: ${{ runner.os == 'Linux' }}
        with:
          make-default: true

      - name: Get rust version from Cargo.toml
        shell: bash
        run: |
          rust_version=$(yq -oy '.package.rust-version' Cargo.toml)
          echo "rust_version=${rust_version}" >> $GITHUB_ENV

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "${{ env.rust_version }}"

      - uses: Swatinem/rust-cache@v2.9.1

      - name: Install cargo-hack
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
          checksum: true

      - name: Run `cargo hack`
        shell: bash
        run: cargo hack check --each-feature --all-targets --package hyperswitch_card_vault

  test:
    name: Run tests on stable toolchain
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install mold linker
        uses: rui314/setup-mold@v1
        if: ${{ runner.os == 'Linux' }}
        with:
          make-default: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable 2 weeks ago
          components: clippy

      - name: Install cargo-hack
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
          checksum: true

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
          checksum: true

      - uses: Swatinem/rust-cache@v2.9.1

      - name: Run clippy
        shell: bash
        run: cargo clippy --all-features --all-targets

      - name: Check Cargo.lock unchanged
        shell: bash
        run: |
          if ! git diff --quiet --exit-code -- Cargo.lock ; then
            echo "::error::Cargo.lock is out of date; run cargo build locally and commit the updated Cargo.lock"
            git diff -- Cargo.lock
            exit 1
          fi

      - name: Cargo hack
        shell: bash
        run: cargo hack check --each-feature --no-dev-deps

      - name: Run unit tests
        shell: bash
        run: |
          cargo nextest run --profile ci --all-features
          cargo test --doc --all-features

  typos:
    name: Spell check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Spell check
        uses: crate-ci/typos@master

  threat-model:
    name: Threat model references
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check the threat model table
        run: ./scripts/check-threat-model.sh

  integration-db:
    name: End-to-end tests and demo against PostgreSQL
    runs-on: ubuntu-latest

    services:
      postgres:
        image: "postgres:alpine"
        env:
          POSTGRES_DB: locker
          POSTGRES_USER: postgres
          # Trust authentication keeps passwords out of the URLs below; the database only lives
          # for this job.
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install mold linker
        uses: rui314/setup-mold@v1
        if: ${{ runner.os == 'Linux' }}
        with:
          make-default: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable 2 weeks ago

      - uses: Swatinem/rust-cache@v2.9.1

      - name: Run end-to-end tests
        shell: bash
        env:
          VAULT_TEST_DATABASE_URL: postgres://postgres@localhost:5432/postgres
          # Fails the tests instead of skipping them if the URL above goes missing.
          VAULT_TEST_REQUIRE_DB: "1"
        run: cargo test --features key_custodian --test vault_e2e

      - name: Create the demo database
        shell: bash
        run: psql postgres://postgres@localhost:5432/postgres -c 'CREATE DATABASE demo'

      - name: Run the demo
        shell: bash
        env:
          DEMO_DATABASE_URL: postgres://postgres@localhost:5432/demo
        run: |
          make demo | tee demo-output.txt
          count=$(grep -c 4111111111111111 demo-output.txt || true)
          echo "test card number lines in the demo output: ${count} (at most 3 allowed)"
          test "${count}" -le 3

  rehash-without-custodian:
    name: Re-hash without the key_custodian feature
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: "postgres:alpine"
        env:
          POSTGRES_DB: locker
          POSTGRES_USER: postgres
          # Trust authentication keeps passwords out of the URLs below; the database only lives
          # for this job.
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mold linker
        uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
        with:
          make-default: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master on 2026-11-15
        with:
          toolchain: stable 2 weeks ago

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Run the re-hash tests without key_custodian
        shell: bash
        env:
          VAULT_TEST_DATABASE_URL: postgres://postgres@localhost:5432/postgres
          # Fails the tests instead of skipping them if the URL above goes missing.
          VAULT_TEST_REQUIRE_DB: "1"
        # The count is fixed on purpose, so a filter that matches no test cannot pass: update it
        # when a re-hash test is added or gated.
        run: |
          cargo test --test vault_e2e rehash_ 2>&1 | tee test-output.txt
          grep -q 'test result: ok. 11 passed' test-output.txt || { echo "::error::expected 11 re-hash tests"; exit 1; }

  rehash-kv:
    name: Re-hash refusal with the kv feature
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: "postgres:alpine"
        env:
          POSTGRES_DB: locker
          POSTGRES_USER: postgres
          # Trust authentication keeps passwords out of the URLs below; the database only lives
          # for this job.
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mold linker
        uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
        with:
          make-default: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master on 2026-11-15
        with:
          toolchain: stable 2 weeks ago

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Run the kv refusal test
        shell: bash
        env:
          VAULT_TEST_DATABASE_URL: postgres://postgres@localhost:5432/postgres
          VAULT_TEST_REQUIRE_DB: "1"
        # No Redis service: utils rehash starts without one, and refuses before any storage call.
        run: |
          cargo test --features key_custodian,kv --test vault_e2e rehash_refuses_to_run_with_kv -- --exact 2>&1 | tee test-output.txt
          grep -q 'test result: ok. 1 passed' test-output.txt || { echo "::error::expected 1 kv test"; exit 1; }

  rotation-without-custodian:
    name: Master key rotation without the key_custodian feature
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: "postgres:alpine"
        env:
          POSTGRES_DB: locker
          POSTGRES_USER: postgres
          # Trust authentication keeps passwords out of the URLs below; the database only lives
          # for this job.
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mold linker
        uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
        with:
          make-default: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master on 2026-11-15
        with:
          toolchain: stable 2 weeks ago

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Run the rotation tests without key_custodian
        shell: bash
        env:
          VAULT_TEST_DATABASE_URL: postgres://postgres@localhost:5432/postgres
          # Fails the tests instead of skipping them if the URL above goes missing.
          VAULT_TEST_REQUIRE_DB: "1"
        # The count is fixed on purpose, so a filter that matches no test cannot pass: update it
        # when a rotation test is added or gated.
        run: |
          cargo test --test vault_e2e rotation_ 2>&1 | tee test-output.txt
          grep -q 'test result: ok. 10 passed' test-output.txt || { echo "::error::expected 10 rotation tests"; exit 1; }

  rotation-kv:
    name: Master key rotation refusal with the kv feature
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: "postgres:alpine"
        env:
          POSTGRES_DB: locker
          POSTGRES_USER: postgres
          # Trust authentication keeps passwords out of the URLs below; the database only lives
          # for this job.
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mold linker
        uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
        with:
          make-default: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master on 2026-11-15
        with:
          toolchain: stable 2 weeks ago

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Run the kv refusal test
        shell: bash
        env:
          VAULT_TEST_DATABASE_URL: postgres://postgres@localhost:5432/postgres
          VAULT_TEST_REQUIRE_DB: "1"
        # No Redis service: utils rotate-master-key starts without one, and refuses before any write.
        run: |
          cargo test --features key_custodian,kv --test vault_e2e rotation_refuses_to_run_with_kv -- --exact 2>&1 | tee test-output.txt
          grep -q 'test result: ok. 1 passed' test-output.txt || { echo "::error::expected 1 kv test"; exit 1; }

  rotation-external-key-manager:
    name: Master key rotation with an external key manager
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: "postgres:alpine"
        env:
          POSTGRES_DB: locker
          POSTGRES_USER: postgres
          # Trust authentication keeps passwords out of the URLs below; the database only lives
          # for this job.
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Juspay's Hyperswitch Encryption Service (Apache-2.0), tag v0.1.14, read only. Its published
      # image is built with AWS KMS and mutual TLS; built here with no optional feature, it keeps
      # its keys under its own AES-256 key and serves plain HTTP on the job's private network.
      - name: Checkout the encryption service
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: juspay/hyperswitch-encryption-service
          ref: 18423c5864676604a226e18ea3fff433224b3010 # v0.1.14
          path: cripta
          persist-credentials: false

      - name: Install mold linker
        uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
        with:
          make-default: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master on 2026-11-15
        with:
          toolchain: stable 2 weeks ago

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: |
            . -> target
            cripta -> target

      - name: Build the encryption service
        shell: bash
        run: cargo build --release --locked --manifest-path cripta/Cargo.toml

      - name: Create the encryption service database
        shell: bash
        run: |
          psql postgres://postgres@localhost:5432/postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE encryption_db'
          psql postgres://postgres@localhost:5432/encryption_db -v ON_ERROR_STOP=1 -c 'CREATE SCHEMA global'
          for schema in public global; do
            for migration in $(ls cripta/migrations | sort); do
              PGOPTIONS="-c search_path=${schema}" psql postgres://postgres@localhost:5432/encryption_db \
                -q -v ON_ERROR_STOP=1 -f "cripta/migrations/${migration}/up.sql"
            done
          done

      - name: Run the rotation test against the encryption service
        shell: bash
        env:
          VAULT_TEST_DATABASE_URL: postgres://postgres@localhost:5432/postgres
          VAULT_TEST_REQUIRE_DB: "1"
          VAULT_TEST_KEY_MANAGER_URL: http://127.0.0.1:5050
        run: |
          # The service's own master key, generated for this job only and masked in the log.
          service_key=$(openssl rand -hex 32)
          echo "::add-mask::${service_key}"
          (
            cd cripta
            RUN_ENV=Dev \
            CRIPTA__DATABASE__HOST=127.0.0.1 CRIPTA__DATABASE__PORT=5432 \
            CRIPTA__DATABASE__USER=postgres CRIPTA__DATABASE__PASSWORD=unused \
            CRIPTA__DATABASE__DBNAME=encryption_db CRIPTA__SERVER__PORT=5050 \
            CRIPTA__METRICS__PORT=6129 CRIPTA__SECRETS__MASTER_KEY="${service_key}" \
            CRIPTA__LOG__LOG_LEVEL=info \
            nohup ./target/release/cripta > ../cripta.log 2>&1 &
          )
          unset service_key
          for attempt in $(seq 1 30); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5050/health)" = 200 ]; then
              break
            fi
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:5050/health || { echo "::error::the encryption service did not start"; tail -20 cripta.log; exit 1; }
          cargo test --features key_custodian,external_key_manager --test vault_e2e rotation_with_external_key_manager -- --exact --nocapture 2>&1 | tee test-output.txt
          grep -q 'test result: ok. 1 passed' test-output.txt || { echo "::error::expected 1 external key manager test"; exit 1; }
          if grep -q 'skipped' test-output.txt; then echo "::error::the test was skipped"; exit 1; fi
