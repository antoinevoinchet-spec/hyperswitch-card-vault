name: CI

on:
  pull_request:
    types:
      - opened
      - ready_for_review
      - reopened
      - synchronize

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUSTFLAGS: "-D warnings"

jobs:
  formatting:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rustfmt

      - name: Check formatting
        shell: bash
        run: cargo +nightly fmt --all --check

  check-msrv:
    name: Check compilation on MSRV toolchain
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install mold linker
        uses: rui314/setup-mold@v1
        if: ${{ runner.os == 'Linux' }}
        with:
          make-default: true

      - name: Get rust version from Cargo.toml
        shell: bash
        run: |
          rust_version=$(yq -oy '.package.rust-version' Cargo.toml)
          echo "rust_version=${rust_version}" >> $GITHUB_ENV

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "${{ env.rust_version }}"

      - uses: Swatinem/rust-cache@v2.9.1

      - name: Install cargo-hack
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
          checksum: true

      - name: Run `cargo hack`
        shell: bash
        run: cargo hack check --each-feature --all-targets --package hyperswitch_card_vault

  test:
    name: Run tests on stable toolchain
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install mold linker
        uses: rui314/setup-mold@v1
        if: ${{ runner.os == 'Linux' }}
        with:
          make-default: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable 2 weeks ago
          components: clippy

      - name: Install cargo-hack
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
          checksum: true

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
          checksum: true

      - uses: Swatinem/rust-cache@v2.9.1

      - name: Run clippy
        shell: bash
        run: cargo clippy --all-features --all-targets

      - name: Check Cargo.lock unchanged
        shell: bash
        run: |
          if ! git diff --quiet --exit-code -- Cargo.lock ; then
            echo "::error::Cargo.lock is out of date; run cargo build locally and commit the updated Cargo.lock"
            git diff -- Cargo.lock
            exit 1
          fi

      - name: Cargo hack
        shell: bash
        run: cargo hack check --each-feature --no-dev-deps

      - name: Run unit tests
        shell: bash
        run: |
          cargo nextest run --profile ci --all-features
          cargo test --doc --all-features

  typos:
    name: Spell check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Spell check
        uses: crate-ci/typos@master

  integration-db:
    name: End-to-end tests and demo against PostgreSQL
    runs-on: ubuntu-latest

    services:
      postgres:
        image: "postgres:alpine"
        env:
          POSTGRES_DB: locker
          POSTGRES_USER: postgres
          # Trust authentication keeps passwords out of the URLs below; the database only lives
          # for this job.
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install mold linker
        uses: rui314/setup-mold@v1
        if: ${{ runner.os == 'Linux' }}
        with:
          make-default: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable 2 weeks ago

      - uses: Swatinem/rust-cache@v2.9.1

      - name: Diagnose the vault's database URL (temporary)
        shell: bash
        run: |
          set +e
          psql --version
          dpkg -l | grep -i libpq
          psql "postgres://postgres@localhost:5432/postgres?application_name=public&options=-c search_path%3Dpublic" -c 'select 1'
          echo "with options: exit $?"
          psql "postgres://postgres@localhost:5432/postgres?application_name=public" -c 'select 1'
          echo "without options: exit $?"
          PGPASSWORD=unused psql "postgres://postgres@localhost:5432/postgres" -c 'select 1'
          echo "with a password: exit $?"
          psql "postgres://postgres@127.0.0.1:5432/postgres" -c 'select 1'
          echo "IPv4 address: exit $?"
          getent hosts localhost

      - name: Run end-to-end tests
        shell: bash
        env:
          VAULT_TEST_DATABASE_URL: postgres://postgres@localhost:5432/postgres
          # Fails the tests instead of skipping them if the URL above goes missing.
          VAULT_TEST_REQUIRE_DB: "1"
        run: cargo test --features key_custodian --test vault_e2e

      - name: Show which libpq the vault links (temporary)
        if: always()
        shell: bash
        run: ldd target/debug/locker | grep -i -E 'pq|ssl' || true

      - name: Create the demo database
        shell: bash
        run: psql postgres://postgres@localhost:5432/postgres -c 'CREATE DATABASE demo'

      - name: Run the demo
        shell: bash
        env:
          DEMO_DATABASE_URL: postgres://postgres@localhost:5432/demo
        run: |
          make demo | tee demo-output.txt
          count=$(grep -c 4111111111111111 demo-output.txt || true)
          echo "test card number lines in the demo output: ${count} (at most 3 allowed)"
          test "${count}" -le 3
