# cargo-deny configuration: known vulnerabilities (RustSec database), licenses and crate sources.
# Run in CI by .github/workflows/dependencies.yml. Design:
# docs/superpowers/specs/2026-11-23-hygiene-ci-design.md.

[graph]
# Every optional feature, so that crates used only by the KMS, Redis or middleware features are
# checked too.
all-features = true

[advisories]
# Policy decided by the fork's owner on 2026-11-23: an entry that already affects the original
# code at commit a8ee711 is listed below, with its reason and an expiry date of 2027-02-21. After
# that date it fails again. Any other entry fails the check.
# Limit: the RustSec database describes crates.io releases. The crates taken from git (see the
# sources section) are checked for their source and license, not for known vulnerabilities.
unmaintained = "workspace"
unsound = "workspace"
yanked = "warn"
# Read from the first run of the check on this branch (2026-11-23): 45 known vulnerabilities and 3
# unsound notices on direct dependencies.
ignore = [
