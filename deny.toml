[licenses]
# Every license found in the dependency graph on 2026-11-23; any other license fails.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "MPL-2.0",
    "OpenSSL",
]
confidence-threshold = 0.93

[sources]
# crates.io and the two upstream git repositories only, each pinned by a tag or a revision.
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "tag"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/juspay/hyperswitch",
    "https://github.com/juspay/framework-libs-rs",
]
